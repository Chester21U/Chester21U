<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
  <style>text{font-family:ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace}
    .pulse{stroke-dasharray:4 96;animation:run 4s linear infinite}
    @keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}</style>
  <path d="M0 30 H900" fill="none" stroke="#c8894a" stroke-width="1.6" opacity=".45"/>
  <path d="M0 30 H900" fill="none" stroke="#3cf2c4" stroke-width="2.4" pathLength="100" class="pulse" opacity="1"/>
  <text x="450" y="64" font-size="13" fill="#6f8a7c" text-anchor="middle">EOF · señal estable desde El Salvador<tspan fill="#3cf2c4" class="blink"> ●</tspan></text>
</svg>
